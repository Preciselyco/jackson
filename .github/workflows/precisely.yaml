# Precisely CI.
#
# Upstream's own workflow (.github/workflows/main.yml) is left untouched but is
# disabled in the repository's Actions settings, because it builds and publishes
# artifacts to BoxyHQ/Ory's registries. This workflow is the Precisely
# replacement: it runs every check and build upstream runs, and pushes the
# container to our own Artifact Registry: on a merge to `precisely` to the
# `services` repository, and for a pull request from a branch of this repository
# to `services-pr`, so the change can be deployed to staging by hand. A pull
# request from a fork builds the image but never authenticates or pushes. It
# publishes nothing to BoxyHQ/Ory: no npm publish, no Docker Hub or GHCR login,
# no signing step — see PRECISELY.md.
#
# It builds and pushes the image, but stops there.
# Rolling the image out to a cluster stays a deliberate act: deploy_shelob.sh is
# never called from here.

name: Precisely CI

on:
  push:
    branches:
      - precisely
  pull_request:
    branches:
      - precisely
  workflow_dispatch:

# contents: read is all the checkout needs. The image job alone also asks for
# id-token: write, which mints the short-lived OIDC token Workload Identity
# Federation exchanges for GCP credentials; the checks and tests have no use for
# it.
permissions:
  contents: read

jobs:
  ci:
    name: Checks, build and tests
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: secret
      NEXTAUTH_URL: http://localhost:5225
      NEXTAUTH_ACL: '*@boxyhq.com'
      DB_ENGINE: sql
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_TYPE: postgres
      DB_ENCRYPTION_KEY: 'IDv0Q/4meshxZOvDhtZUWsHMRf9VCvBt+PoB8z3bZV8='
      DEBUG: pw:webserver
      SAML_AUDIENCE: https://saml.boxyhq.com
      API_KEYS: secret
      OPENID_JWS_ALG: RS256
      OPENID_RSA_PUBLIC_KEY: ''
      OPENID_RSA_PRIVATE_KEY: ''
      PLANETSCALE_URL: mysql://root:mysql@localhost:3308/mysql
      DYNAMODB_URL: 'http://localhost:8000'
      POLIS_NO_ANALYTICS: '1'
      IDP_ENABLED: true
      AWS_ACCESS_KEY_ID: secret
      AWS_SECRET_ACCESS_KEY: secret
      POLIS_LICENSE_KEY: 'dummy-license'
    strategy:
      matrix:
        node-version: [24]

    services:
      postgres:
        image: postgres:18.4
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mocksaml:
        image: boxyhq/mock-saml:1.4.2
        ports:
          - 4000:4000
        env:
          APP_URL: http://localhost:4000
          ENTITY_ID: https://saml.example.com/entityid
          PUBLIC_KEY: ''
          PRIVATE_KEY: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true

      - run: node -v
      - run: npm -v

      - name: Setup Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm i
      - run: npm run check-lint
      - run: npm run check-types
      - run: npm run check-format
      - run: npm run check-locale
      - run: npm run build

      # We run Postgres and nothing else, so upstream's multi-engine storage
      # suite is not worth eight extra service containers. Everything it covers
      # is upstream code we do not touch, and the Postgres path it exercises is
      # covered end to end by the e2e run below, which drives the app on
      # Postgres. Moving the file aside keeps `npm run test` as upstream defines
      # it; if upstream ever renames the file this step fails loudly rather than
      # silently skipping nothing.
      - name: Skip the multi-engine storage suite
        run: mv npm/test/db/db.test.ts "${RUNNER_TEMP}/db.test.ts.skipped"

      # The library tests cover npm/src/directory-sync/scim/DirectoryUsers.ts,
      # which is the one upstream file we modify.
      - run: npm run test
        working-directory: ./npm

      - name: Install playwright browser dependencies
        run: npx playwright install chromium

      - name: e2e tests
        run: npx ts-node --log-error e2e/support/pretest.ts && npx playwright test -x

      - name: Upload e2e trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 2

  image:
    name: Container image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # persist-credentials: false matters more here than anywhere: the build is
      # COPY . . in a public repository's image, and the token must not be in
      # .git/config when it runs.
      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull_request event stamps the merge commit rather than the commit
      # under review, so take the head sha there. <short sha>-gh is the release
      # tag every service uses.
      #
      # push_repo decides where, if anywhere, the image goes, and is the one
      # condition the auth, login and push steps below test. service_account is
      # the identity that push runs as; each account can write to its own
      # repository only:
      #   services     a push to `precisely`, i.e. a merge — the release image,
      #                as github-actions-jackson
      #   services-pr  a pull request from a branch of this repository, as
      #                github-actions-jackson-pr
      #   (empty)      anything else, fork pull requests included: build only
      # A fork's pull request runs without access to this repository's
      # identity, so it must never reach the auth step.
      - name: Set build vars
        id: vars
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          push_repo=""
          service_account=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            commit_sha="$PR_HEAD_SHA"
            if [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              push_repo="services-pr"
              service_account="github-actions-jackson-pr@precisely-production.iam.gserviceaccount.com"
            fi
          else
            commit_sha="$GITHUB_SHA"
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/precisely" ]; then
              push_repo="services"
              service_account="github-actions-jackson@precisely-production.iam.gserviceaccount.com"
            fi
          fi
          short_sha=$(echo "$commit_sha" | cut -c 1-7)
          tag="${short_sha}-gh"
          {
            echo "tag=$tag"
            echo "push_repo=$push_repo"
            echo "service_account=$service_account"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE=europe-docker.pkg.dev/precisely-production/${push_repo:-services}/jackson:$tag" >> "$GITHUB_ENV"

      # Built before authenticating on purpose: Dockerfile line 39 is `COPY . .`,
      # and no credential material belongs in the build context of a public
      # repository's image. Building first needs no credentials (the base images
      # are public). The auth step below also writes no credentials file, and the
      # checkout does not persist its token, so the ordering is a second line of
      # defence rather than the only one.
      #
      # Plain docker build, not build-push-action: buildkit's default
      # provenance/SBOM attestations would publish an OCI index where the
      # clusters and Shelob expect a plain image manifest. The build runs on
      # every event, which is what catches a Dockerfile broken by an upstream
      # sync; only the push depends on push_repo.
      - name: Build container
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build -f Dockerfile -t "$IMAGE" .

      # Workload Identity Federation, not a service account key. This repository
      # is public, so a long-lived key stored here would be one careless step
      # away from a world-readable log or artifact; a federated token lasts
      # minutes and is only issued to a workflow run in this repository.
      #
      # None of these values is a secret, so they are written out rather than
      # hidden in an org secret this repository may or may not be granted.
      # All come from ../iap/gcp-github (pulumi stack `production`): the
      # provider is the shared `workloadIdentityProvider` output; the service
      # account is picked in `Set build vars`. There are two, and each exists
      # only to push this image:
      #   github-actions-jackson     `jacksonServiceAccountEmail`; bound to
      #                              refs/heads/precisely, artifactregistry.writer
      #                              on `services` only
      #   github-actions-jackson-pr  bound to the pull_request OIDC subject,
      #                              artifactregistry.writer on `services-pr` only
      # So a pull request run can never write a release image, and neither
      # account holds anything else.
      #
      # An access token straight into docker login rather than gcloud: nothing
      # else here needs gcloud, and it drops the pinned SDK version. This is the
      # same thing Preciselyco/actions/gcp-auth does, written out because a public
      # repository cannot use actions from a private one.
      - name: gcloud auth
        id: auth
        if: steps.vars.outputs.push_repo != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/179949444356/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: ${{ steps.vars.outputs.service_account }}
          token_format: access_token
          # No credentials file in the workspace of a public repository's build.
          create_credentials_file: false

      - name: docker login
        if: steps.vars.outputs.push_repo != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The digest is recorded because that is what a deploy would be pinned to.
      # Nothing here deploys: rolling this image out is a separate, deliberate
      # act, and deploy_shelob.sh is not called from this workflow. A
      # `services-pr` image is for staging only — see PRECISELY.md.
      - name: Push container
        id: push
        if: steps.vars.outputs.push_repo != ''
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{join .RepoDigests "\n"}}' "$IMAGE" \
            | head -n1 | cut -d@ -f2 | cut -d: -f2)
          if [ -z "$digest" ]; then
            echo "::error::could not resolve image digest after push"
            exit 1
          fi
          echo "pushed $IMAGE @ sha256:$digest"
          {
            echo "### Image pushed"
            echo ""
            echo "\`$IMAGE\`"
            echo ""
            echo "digest \`sha256:$digest\`  —  not deployed; roll out separately"
          } >> "$GITHUB_STEP_SUMMARY"
